<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venues — UCM 32 Aniversario</title>
<style>
  :root {
    --wine:#A84055; --gold:#C9BB7A; --dark:#0A0A0A; --panel:#161616;
    --bg:#F4F2EF; --card:#FFFFFF; --text:#1A1A1A; --muted:#6B6B6B; --border:#E4E1DA;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}

  /* HEADER */
  header{background:var(--dark);padding:36px 24px 0;text-align:center;}
  .logo-pill{display:inline-flex;align-items:center;background:white;border-radius:14px;padding:14px 36px;}
  .logo-pill img{height:60px;display:block;}
  .header-stripe{height:5px;background:linear-gradient(90deg,var(--wine),var(--gold),var(--wine));}
  .header-sub{background:var(--panel);text-align:center;padding:14px 24px;color:#888;font-size:12px;letter-spacing:2px;text-transform:uppercase;}
  .header-sub strong{color:var(--gold);}

  /* TABS */
  .day-nav{background:var(--panel);display:flex;justify-content:center;gap:8px;padding:12px 24px 16px;border-bottom:1px solid #2A2A2A;}
  .day-btn{background:transparent;border:1px solid #333;color:#777;padding:10px 32px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;letter-spacing:.4px;transition:all .18s;}
  .day-btn:hover{border-color:var(--gold);color:var(--gold);}
  .day-btn.active{background:var(--gold);border-color:var(--gold);color:var(--dark);}

  /* DAY SECTIONS */
  .day-section{display:none;}
  .day-section.active{display:block;}
  .venues-grid{max-width:1200px;margin:0 auto;padding:28px 16px 48px;display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  @media(max-width:760px){.venues-grid{grid-template-columns:1fr;}}

  /* LOADING */
  .loading{text-align:center;padding:60px 24px;color:var(--muted);font-size:15px;}
  .loading::before{content:'⏳ ';font-size:24px;}

  /* VENUE CARD */
  .venue-card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 3px 16px rgba(0,0,0,.09);}
  .venue-header{padding:22px 24px 18px;color:white;position:relative;}
  .venue-header.inspace{background:var(--wine);}
  .venue-header.camino{background:#3A5A6A;}
  .venue-header.marquis{background:#5A4A7A;}
  .venue-header h2{font-size:24px;font-weight:700;}
  .vh-sub{font-size:12px;opacity:.7;margin-top:4px;letter-spacing:.5px;text-transform:uppercase;}
  .venue-badge{position:absolute;top:18px;right:20px;background:rgba(255,255,255,.18);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;}

  /* CATEGORY ROWS */
  .cat-row{border-bottom:1px solid var(--border);}
  .cat-row:last-of-type{border-bottom:none;}
  details summary{display:flex;align-items:center;justify-content:space-between;padding:15px 22px;cursor:pointer;list-style:none;user-select:none;transition:background .15s;}
  details summary::-webkit-details-marker{display:none;}
  details summary:hover{background:#FAFAF8;}
  .cat-left{display:flex;align-items:center;gap:11px;}
  .cat-icon{width:34px;height:34px;border-radius:9px;background:#F0EDE8;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
  .cat-name{font-weight:600;font-size:14px;}
  .cat-right{display:flex;align-items:center;gap:10px;}
  .cat-total-amt{font-weight:700;font-size:15px;}
  .cat-arrow{font-size:10px;color:var(--muted);transition:transform .2s;}
  details[open] .cat-arrow{transform:rotate(180deg);}
  .cat-body{padding:0 22px 14px;}
  .cat-note{font-size:12px;color:var(--muted);margin-bottom:10px;font-style:italic;}

  /* LINE ITEMS */
  .line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13.5px;}
  .line:last-child{border-bottom:none;}
  .line-desc{color:var(--muted);}
  .line-price{font-weight:600;}
  .tbd{color:#bbb;font-style:italic;}

  /* CATERING OPTIONS */
  .cat-opts{display:flex;flex-direction:column;}
  .cat-opt{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px dashed var(--border);cursor:pointer;}
  .cat-opt:last-child{border-bottom:none;}
  .cat-opt input[type="radio"]{margin-top:3px;accent-color:var(--wine);cursor:pointer;}
  .cat-opt-info{flex:1;}
  .cat-opt-name{font-size:14px;font-weight:600;display:block;}
  .cat-opt-price{font-weight:700;font-size:14px;color:var(--wine);white-space:nowrap;margin-top:2px;}

  /* GRAND TOTAL */
  .grand-total-row{margin:4px 18px 20px;background:var(--dark);border-radius:11px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;}
  .gt-label{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:1px;}
  .gt-amount{font-size:22px;font-weight:800;color:var(--gold);}

  footer{text-align:center;padding:24px;font-size:12px;color:#888;background:var(--panel);margin-top:8px;}
</style>
</head>
<body>

<header>
  <div class="logo-pill">
    <img src="logo-ucm.png" alt="Union de Credito Mexicano">
  </div>
  <div class="header-stripe"></div>
</header>
<div class="header-sub">32 Aniversario &nbsp;·&nbsp; <strong>Comparativa de Venues</strong></div>

<nav class="day-nav">
  <button class="day-btn active" onclick="showDay('day15',this)">15 Octubre</button>
  <button class="day-btn" onclick="showDay('day16',this)">16 Octubre</button>
</nav>

<div id="day15" class="day-section active">
  <div class="venues-grid" id="grid15"><div class="loading">Cargando datos...</div></div>
</div>
<div id="day16" class="day-section">
  <div class="venues-grid" id="grid16"><div class="loading">Cargando datos...</div></div>
</div>

<footer>Union de Credito Mexicano &nbsp;·&nbsp; 32 Aniversario 2026 &nbsp;·&nbsp; Uso interno</footer>

<script>
const CATS_ORDER = ['renta','video','audio','iluminacion','mobiliario','catering'];
const CATS_META = {
  renta:      {icon:'🏛️', label:'Renta de Venue'},
  video:      {icon:'🎬', label:'Video'},
  audio:      {icon:'🎙️', label:'Audio'},
  iluminacion:{icon:'💡', label:'Iluminacion'},
  mobiliario: {icon:'🪑', label:'Mobiliario'},
  catering:   {icon:'🍽️', label:'Catering'},
};
const VENUES_META = {
  inspace:{nombre:'Inspace',    css:'inspace'},
  camino: {nombre:'Camino Real',css:'camino'},
  marquis:{nombre:'Marquis',    css:'marquis'},
};
const DAYS_CONFIG = {'15':['inspace','camino'],'16':['inspace','marquis']};

// Fixed totals stored per card for grand total recalc
const fixedTotals = {};

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(',').map(h => h.trim());
  return lines.slice(1).filter(l => l.trim()).map(line => {
    const vals = [];
    let inQ = false, cur = '';
    for (const ch of line + ',') {
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { vals.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    return Object.fromEntries(headers.map((h,i) => [h, vals[i] ?? '']));
  });
}

function fmt(n) {
  const num = Number(n);
  if (!num) return '<span class="tbd">Por cotizar</span>';
  return '$ ' + num.toLocaleString('es-MX', {minimumFractionDigits:0});
}
function fmtPlain(n) {
  const num = Number(n);
  if (!num) return 'Por cotizar';
  return '$ ' + num.toLocaleString('es-MX', {minimumFractionDigits:0});
}
function num(n) { return Number(n) || 0; }

function buildCard(venueKey, day, rows, idx) {
  const vm = VENUES_META[venueKey];
  const vRows = rows.filter(r => r.dia == day && r.venue === venueKey);
  const cid = `c${day}${venueKey}`;

  let fixedTotal = 0;
  const catSections = CATS_ORDER.map(catKey => {
    const catRows = vRows.filter(r => r.categoria === catKey);
    if (!catRows.length) return '';
    const cm = CATS_META[catKey];
    const isCat = catKey === 'catering';
    let subtotal = 0;
    let body = '';

    if (isCat) {
      body = `<p class="cat-note">Selecciona la opcion que mejor se adapte:</p><div class="cat-opts">`;
      catRows.forEach(r => {
        const p = num(r.precio);
        body += `<label class="cat-opt">
          <input type="radio" name="${cid}-cat" value="${p}" onchange="onCat('${cid}')">
          <div class="cat-opt-info"><span class="cat-opt-name">${r.concepto}</span></div>
          <span class="cat-opt-price">${fmtPlain(p)}</span>
        </label>`;
      });
      body += `</div>`;
    } else {
      catRows.forEach(r => {
        const p = num(r.precio);
        subtotal += p;
        body += `<div class="line"><span class="line-desc">${r.concepto}</span><span class="line-price">${fmt(p)}</span></div>`;
      });
      fixedTotal += subtotal;
    }

    const tid = `${cid}-${catKey}-t`;
    return `<div class="cat-row"><details>
      <summary>
        <span class="cat-left"><span class="cat-icon">${cm.icon}</span><span class="cat-name">${cm.label}</span></span>
        <span class="cat-right"><span class="cat-total-amt" id="${tid}">${isCat ? 'Seleccionar' : fmtPlain(subtotal)}</span><span class="cat-arrow">▼</span></span>
      </summary>
      <div class="cat-body">${body}</div>
    </details></div>`;
  }).join('');

  fixedTotals[cid] = fixedTotal;

  return `<div class="venue-card">
    <div class="venue-header ${vm.css}">
      <h2>${vm.nombre}</h2>
      <div class="vh-sub">Venue ${idx+1} · ${day} de octubre</div>
      <span class="venue-badge">V${idx+1}</span>
    </div>
    ${catSections}
    <div class="grand-total-row">
      <span class="gt-label">Total estimado</span>
      <span class="gt-amount" id="${cid}-grand">${fmtPlain(fixedTotal)}</span>
    </div>
  </div>`;
}

function onCat(cid) {
  const sel = document.querySelector(`input[name="${cid}-cat"]:checked`);
  const catVal = sel ? num(sel.value) : 0;
  const total = (fixedTotals[cid] || 0) + catVal;
  const tid = document.getElementById(`${cid}-catering-t`);
  if (tid) tid.textContent = fmtPlain(catVal);
  const grandEl = document.getElementById(`${cid}-grand`);
  if (grandEl) grandEl.textContent = fmtPlain(total);
}

function renderDay(day, rows) {
  const grid = document.getElementById(`grid${day}`);
  const venues = DAYS_CONFIG[day];
  grid.innerHTML = venues.map((vk, i) => buildCard(vk, day, rows, i)).join('');
}

function showDay(id, btn) {
  document.querySelectorAll('.day-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

(async () => {
  try {
    const res = await fetch('data.csv?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = parseCSV(await res.text());
    renderDay('15', rows);
    renderDay('16', rows);
  } catch(e) {
    document.querySelectorAll('.venues-grid').forEach(g => {
      g.innerHTML = '<p style="padding:32px;color:#999;text-align:center">⚠️ No se pudo cargar data.csv — verifica que el archivo existe en el repositorio.</p>';
    });
  }
})();
</script>
</body>
</html>
