<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venues — UCM 32 Aniversario</title>
<style>
  :root{--wine:#A84055;--gold:#C9BB7A;--dark:#0A0A0A;--panel:#161616;--bg:#F4F2EF;--card:#FFFFFF;--text:#1A1A1A;--muted:#6B6B6B;--border:#E4E1DA;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  header{background:var(--dark);padding:36px 24px 0;text-align:center;}
  .logo-pill{display:inline-flex;align-items:center;background:white;border-radius:14px;padding:14px 36px;}
  .logo-pill img{height:60px;display:block;}
  .header-stripe{height:5px;background:linear-gradient(90deg,var(--wine),var(--gold),var(--wine));}
  .header-sub{background:var(--panel);text-align:center;padding:14px;color:#888;font-size:12px;letter-spacing:2px;text-transform:uppercase;}
  .header-sub strong{color:var(--gold);}
  .day-nav{background:var(--panel);display:flex;justify-content:center;gap:8px;padding:12px 24px 16px;border-bottom:1px solid #2A2A2A;}
  .day-btn{background:transparent;border:1px solid #333;color:#777;padding:10px 32px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;transition:all .18s;}
  .day-btn:hover{border-color:var(--gold);color:var(--gold);}
  .day-btn.active{background:var(--gold);border-color:var(--gold);color:var(--dark);}
  .day-section{display:none;}
  .day-section.active{display:block;}
  .venues-grid{max-width:1220px;margin:0 auto;padding:28px 16px 48px;display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  @media(max-width:760px){.venues-grid{grid-template-columns:1fr;}}
  .loading{grid-column:1/-1;text-align:center;padding:60px;color:var(--muted);font-size:15px;}
  .venue-card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 3px 16px rgba(0,0,0,.09);}
  .venue-header{padding:22px 24px 18px;color:white;position:relative;}
  .venue-header.inspace{background:var(--wine);}
  .venue-header.camino{background:#3A5A6A;}
  .venue-header.marquis{background:#5A4A7A;}
  .venue-header h2{font-size:24px;font-weight:700;}
  .vh-sub{font-size:12px;opacity:.7;margin-top:4px;letter-spacing:.5px;text-transform:uppercase;}
  .venue-badge{position:absolute;top:18px;right:20px;background:rgba(255,255,255,.18);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;}
  .cat-row{border-bottom:1px solid var(--border);}
  .cat-row:last-of-type{border-bottom:none;}
  details summary{display:flex;align-items:center;justify-content:space-between;padding:15px 22px;cursor:pointer;list-style:none;user-select:none;transition:background .15s;}
  details summary::-webkit-details-marker{display:none;}
  details summary:hover{background:#FAFAF8;}
  .cat-left{display:flex;align-items:center;gap:11px;}
  .cat-icon{width:34px;height:34px;border-radius:9px;background:#F0EDE8;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
  .cat-name{font-weight:600;font-size:14px;}
  .cat-right{display:flex;align-items:center;gap:10px;}
  .cat-amt{font-weight:700;font-size:15px;}
  .cat-arrow{font-size:10px;color:var(--muted);transition:transform .2s;}
  details[open] .cat-arrow{transform:rotate(180deg);}
  .cat-body{padding:0 22px 14px;}
  .cat-note{font-size:12px;color:var(--muted);margin-bottom:10px;font-style:italic;}
  .line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13.5px;}
  .line:last-child{border-bottom:none;}
  .line-desc{color:var(--muted);}
  .line-price{font-weight:600;}
  .tbd{color:#C0BDB8;font-style:italic;font-weight:400;}
  .line-nota{display:block;font-size:11px;color:#B0ACA6;font-style:italic;font-weight:400;margin-top:2px;}
  .badge-incluido{display:inline-block;background:#2D6A4F;color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;letter-spacing:.4px;}
  .cat-opts{display:flex;flex-direction:column;}
  .cat-opt{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--border);cursor:pointer;}
  .cat-opt:last-child{border-bottom:none;}
  .cat-opt input[type="radio"]{accent-color:var(--wine);cursor:pointer;width:15px;height:15px;flex-shrink:0;}
  .cat-opt-name{flex:1;font-size:14px;font-weight:600;}
  .cat-opt-price{font-weight:700;font-size:14px;color:var(--wine);white-space:nowrap;}
  .grand-total-row{margin:4px 18px 20px;background:var(--dark);border-radius:11px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;}
  .gt-label{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:1px;}
  .gt-amount{font-size:22px;font-weight:800;color:var(--gold);}
  .notes-section{margin:0 18px 20px;border-radius:10px;overflow:hidden;border:1px solid var(--border);}
  .notes-label{background:#3A5A7A;color:white;padding:9px 16px;font-size:12px;font-weight:700;letter-spacing:.5px;}
  .notes-body{padding:12px 16px;font-size:13px;color:var(--muted);background:#F7FAFD;line-height:1.6;white-space:pre-wrap;min-height:40px;}
  footer{text-align:center;padding:24px;font-size:12px;color:#888;background:var(--panel);margin-top:8px;}
</style>
</head>
<body>

<header>
  <div class="logo-pill">
    <img src="logo-ucm.png" alt="Union de Credito Mexicano">
  </div>
  <div class="header-stripe"></div>
</header>
<div class="header-sub">32 Aniversario &nbsp;·&nbsp; <strong>Comparativa de Venues</strong></div>

<nav class="day-nav">
  <button class="day-btn active" onclick="showDay('day15',this)">15 Octubre</button>
  <button class="day-btn" onclick="showDay('day16',this)">16 Octubre</button>
</nav>

<div id="day15" class="day-section active">
  <div class="venues-grid" id="grid15"><div class="loading">Cargando datos...</div></div>
</div>
<div id="day16" class="day-section">
  <div class="venues-grid" id="grid16"><div class="loading">Cargando datos...</div></div>
</div>

<footer>Union de Credito Mexicano &nbsp;·&nbsp; 32 Aniversario 2026 &nbsp;·&nbsp; Uso interno</footer>

<script>
// ── Google Sheets publicado como CSV ──
const PUBLISHED_ID = '2PACX-1vRSE1UYtQS9H87a8lG4oWxbt3kxIra0p_XXlfYjmlgDl49yfk77XcXlejZb1irr7gnGbBpaynwq7zMk';
const TABS = {
  '15-inspace': 1026995192,
  '15-camino':  1988844649,
  '16-inspace': 745391160,
  '16-marquis': 192206302,
};
// ──────────────────────────────────────

const CATS_META = {
  renta:       {icon:'🏛️', label:'Renta de Venue'},
  video:       {icon:'🎬', label:'Video'},
  audio:       {icon:'🎙️', label:'Audio'},
  iluminacion: {icon:'💡', label:'Iluminacion'},
  mobiliario:  {icon:'🪑', label:'Mobiliario'},
  extras:      {icon:'⚡', label:'Extras'},
  catering:    {icon:'🍽️', label:'Catering'},
};
const CATS_ORDER = ['renta','video','audio','iluminacion','mobiliario','extras','catering'];
const VENUES_META = {
  inspace: {nombre:'Inspace',     css:'inspace'},
  camino:  {nombre:'Camino Real', css:'camino'},
  marquis: {nombre:'Marquis',     css:'marquis'},
};
const VENUE_IDX = {'15-inspace':0,'15-camino':1,'16-inspace':0,'16-marquis':1};
const LAYOUT    = {'15':['inspace','camino'],'16':['inspace','marquis']};
const fixedTotals = {};

function tabUrl(key){
  return `https://docs.google.com/spreadsheets/d/e/${PUBLISHED_ID}/pub?gid=${TABS[key]}&single=true&output=csv&t=${Date.now()}`;
}

function isIncluido(v){ return typeof v==='string' && v.trim().toUpperCase()==='INCLUIDO'; }
// Handles all common number formats from Google Sheets:
//   "$351.480"   → 351480  (MX: period=thousands, no decimals)
//   "$30,000.00" → 30000   (US: comma=thousands, period=decimal)
//   "30000"      → 30000   (raw number)
function parsePrice(v){
  if(!v && v!==0) return null;
  const s=String(v).trim();
  if(!s) return null;
  let c=s.replace(/[$€£\s]/g,'');
  if(!c) return null;
  const ci=c.lastIndexOf(','), di=c.lastIndexOf('.');
  if(ci!==-1 && di!==-1){
    // Both separators: last one is the decimal
    c = di>ci ? c.replace(/,/g,'') : c.replace(/\./g,'').replace(',','.');
  } else if(di!==-1 && ci===-1){
    // Only dot: if exactly 3 digits follow → MX thousands separator, else decimal
    const after=c.slice(di+1);
    if(/^\d{3}$/.test(after)) c=c.replace(/\./g,'');
  } else if(ci!==-1 && di===-1){
    // Only comma: if exactly 3 digits follow → thousands, else decimal
    const after=c.slice(ci+1);
    c = /^\d{3}$/.test(after) ? c.replace(/,/g,'') : c.replace(',','.');
  }
  const n=parseFloat(c);
  return isNaN(n)?null:n;
}
function fmt(v){
  if(isIncluido(v)) return '<span class="badge-incluido">&#10003; Incluido</span>';
  const n=parsePrice(v); if(n===null||!n) return '<span class="tbd">Por cotizar</span>';
  return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtPlain(v){
  if(isIncluido(v)) return 'Incluido';
  const n=parsePrice(v); if(n===null||!n) return 'Por cotizar';
  return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function toNum(v){ if(isIncluido(v)) return 0; const n=parsePrice(v); return n??0; }

function parseCSV(txt){
  const rows=[]; let i=0,L=txt.length;
  while(i<L){
    const row=[];
    while(i<L && txt[i]!=='\n' && txt[i]!=='\r'){
      if(txt[i]==='"'){
        i++; let val='';
        while(i<L){ if(txt[i]==='"'){ if(txt[i+1]==='"'){val+='"';i+=2;}else{i++;break;} }else{val+=txt[i++];} }
        row.push(val); if(i<L&&txt[i]===',')i++;
      }else{
        let val='';
        while(i<L&&txt[i]!==','&&txt[i]!=='\n'&&txt[i]!=='\r')val+=txt[i++];
        row.push(val.trim()); if(i<L&&txt[i]===',')i++;
      }
    }
    if(i<L&&txt[i]==='\r')i++; if(i<L&&txt[i]==='\n')i++;
    if(row.some(c=>c!==''))rows.push(row);
  }
  return rows;
}

// col A=categoria, col B=concepto, col C=tipo, col D=precio, col E=incluido (checkbox TRUE/FALSE)
// Skips header rows, blank rows, total rows — keeps only tipo=item/opcion/nota
// col A=categoria, col B=concepto, col C=tipo, col D=precio, col E=notas, col F=incluido (TRUE/FALSE)
function parseTabRows(txt){
  const raw = parseCSV(txt);
  const result = [];
  for(const row of raw){
    const tipo = (row[2]||'').trim().toLowerCase();
    if(tipo==='item'||tipo==='opcion'||tipo==='nota'){
      result.push({
        categoria: (row[0]||'').trim().toLowerCase(),
        concepto:  (row[1]||'').trim(),
        tipo,
        precio:    (row[3]||'').trim(),
        notas:     (row[4]||'').trim(),
        incluido:  (row[5]||'').trim().toUpperCase() === 'TRUE',
      });
    }
  }
  return result;
}

function buildCard(day, venueKey, rows){
  const vm=VENUES_META[venueKey], idx=VENUE_IDX[day+'-'+venueKey]??0, cid='c'+day+venueKey;
  const bycat={};
  for(const r of rows){ if(!bycat[r.categoria])bycat[r.categoria]=[]; bycat[r.categoria].push(r); }
  let fixedTotal=0;
  const catSections=CATS_ORDER.map(catKey=>{
    const catRows=bycat[catKey]; if(!catRows||!catRows.length)return '';
    const cm=CATS_META[catKey], isCat=catKey==='catering'; let subtotal=0, body='';
    if(isCat){
      body='<p class="cat-note">Selecciona la opcion que mejor se adapte:</p><div class="cat-opts">';
      catRows.forEach(r=>{
        body+=`<label class="cat-opt"><input type="radio" name="${cid}-cat" value="${r.precio}" onchange="onCat('${cid}')"><span class="cat-opt-name">${r.concepto}</span><span class="cat-opt-price">${fmtPlain(r.precio)}</span></label>`;
      });
      body+='</div>';
    }else{
      catRows.forEach(r=>{
        const isInc = r.incluido || isIncluido(r.precio);
        const dispPrice = isInc ? '<span class="badge-incluido">&#10003; Incluido</span>' : fmt(r.precio);
        subtotal += isInc ? 0 : toNum(r.precio);
        const notaHtml = r.notas ? `<span class="line-nota">${r.notas}</span>` : '';
        body += `<div class="line"><span class="line-desc">${r.concepto}${notaHtml}</span><span class="line-price">${dispPrice}</span></div>`;
      });
      fixedTotal+=subtotal;
    }
    const hasIncluido=!isCat&&catRows.some(r=>r.incluido||isIncluido(r.precio));
    const catAmt=isCat?'Seleccionar':subtotal>0?fmtPlain(subtotal):hasIncluido?'Incluido':'Por cotizar';
    return `<div class="cat-row"><details><summary><span class="cat-left"><span class="cat-icon">${cm.icon}</span><span class="cat-name">${cm.label}</span></span><span class="cat-right"><span class="cat-amt" id="${cid}-${catKey}-t">${catAmt}</span><span class="cat-arrow">&#9660;</span></span></summary><div class="cat-body">${body}</div></details></div>`;
  }).join('');
  fixedTotals[cid]=fixedTotal;
  const notaRow=(bycat['notas']||[]).find(r=>r.tipo==='nota');
  const notaText=notaRow?.concepto||'';
  return `<div class="venue-card"><div class="venue-header ${vm.css}"><h2>${vm.nombre}</h2><div class="vh-sub">Venue ${idx+1} &middot; ${day} de octubre</div><span class="venue-badge">V${idx+1}</span></div>${catSections}<div class="grand-total-row"><span class="gt-label">Total estimado</span><span class="gt-amount" id="${cid}-grand">${fmtPlain(fixedTotal)}</span></div><div class="notes-section"><div class="notes-label">&#128221; Notas</div><div class="notes-body">${notaText||'<span class="tbd">Sin notas</span>'}</div></div></div>`;
}

function onCat(cid){
  const sel=document.querySelector(`input[name="${cid}-cat"]:checked`);
  const catVal=sel?toNum(sel.value):0;
  const el=document.getElementById(cid+'-grand');
  if(el)el.textContent=fmtPlain((fixedTotals[cid]||0)+catVal);
  const ct=document.getElementById(cid+'-catering-t');
  if(ct)ct.textContent=fmtPlain(catVal);
}
function showDay(id,btn){
  document.querySelectorAll('.day-section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.day-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active'); btn.classList.add('active');
}

async function fetchTab(key){
  const res=await fetch(tabUrl(key));
  if(!res.ok)throw new Error('HTTP '+res.status+' en pestaña '+key);
  return parseTabRows(await res.text());
}

async function loadData(){
  // Check all GIDs are set
  const missing=Object.entries(TABS).filter(([,v])=>!v).map(([k])=>k);
  if(missing.length){
    document.querySelectorAll('.venues-grid').forEach(g=>{
      g.innerHTML=`<p style="grid-column:1/-1;padding:32px;color:#999;text-align:center">&#9881;&#65039; Faltan los IDs de pestaña para: <strong>${missing.join(', ')}</strong>.<br>Revisa el archivo index.html.</p>`;
    });
    return;
  }
  try{
    // Fetch all 4 tabs in parallel
    const [r15i,r15c,r16i,r16m]=await Promise.all([
      fetchTab('15-inspace'),
      fetchTab('15-camino'),
      fetchTab('16-inspace'),
      fetchTab('16-marquis'),
    ]);
    document.getElementById('grid15').innerHTML=
      buildCard('15','inspace',r15i)+buildCard('15','camino',r15c);
    document.getElementById('grid16').innerHTML=
      buildCard('16','inspace',r16i)+buildCard('16','marquis',r16m);
  }catch(e){
    console.error(e);
    document.querySelectorAll('.venues-grid').forEach(g=>{
      g.innerHTML=`<p style="grid-column:1/-1;padding:32px;color:#999;text-align:center">&#9888;&#65039; No se pudo cargar Google Sheets. Verifica que la hoja esta publicada como CSV.<br><small>${e.message}</small></p>`;
    });
  }
}
loadData();
</script>
</body>
</html>
